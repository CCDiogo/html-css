<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Grandes</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            width: 500px;
        }
        caption{
            background-color: lightgray;
            padding: 5px;
            border: 2px solid black;
            font-size: 1.2em;
        }
        thead{
             font-size: 1.25em;
            font-weight: bold;
            background-color: black;
            color: white;
            border: 2px solid black;

        }
        tbody > tr:nth-child(2n){
            background-color: rgb(194, 194, 194);
        }

        td{
            border: 2px solid black;
            padding: 2px;
            text-align: center;
        }
        .C{
            text-align: right;
        }
        .A{
            text-align: left;
        }
        tfoot{
            font-size: 1.25em;
            font-weight: bold;
            background-color: black;
            color: white;
            border: 2px solid black;

        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <table>
        <caption>Estados Mais Populosos</caption>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
                <th>%</th>
            </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="A">SãoPaulo</td>
                    <td>46.081.801</td>
                    <td class="C">21,59%</td>
                </tr>
                <tr>
                    <td class="A">Minas Geras
                    <td>21.393.441</td>
                    <td class="C">10,02%</td>
                </tr>
                <tr>
                    <td class="A">Rio de Janeiro</td>
                    <td>17.223.547</td>
                    <td class="C">8,07%</td>
                </tr>
                <tr>
                    <td class="A">Bahia</td>
                    <td>14.870.907</td>
                    <td class="C">6,97%</td>
                </tr>
                <tr>
                    <td class="A">Paraná</td>
                    <td>11.890.517</td>
                    <td class="C">5,57%</td>
                </tr>
                <tr>
                    <td class="A">Rio Grande do sul</td>
                    <td>11.233.263</td>
                    <td class="C">5,26%</td>
                </tr>
                <tr>
                    <td class="A">Pernambuco</td>
                    <td>9.562.007</td>
                    <td class="C">4,48%</td>
                </tr>
            </tbody>
        <tfoot>
            <tr>
                <th scope="row" class="A">Total:</th>
                <td>132.255.483</td>
                <td class="C">61,96%</td>
            </tr>
        </tfoot>

    </table>
</body>
</html>
